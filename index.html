<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>My Super Store 3D</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB; /* Sky color fallback */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #game-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Let clicks pass through to the game */
        }
        .hud-panel {
            position: absolute;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 15px;
            border-radius: 8px;
            backdrop-filter: blur(5px);
        }
        #money-display { top: 20px; right: 20px; font-size: 24px; font-weight: bold; color: #4CAF50; }
        #time-display { top: 20px; left: 20px; font-size: 18px; }
        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            width: 10px; height: 10px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }
        #instructions {
            position: absolute;
            bottom: 20px; left: 50%;
            transform: translateX(-50%);
            text-align: center;
            font-size: 14px;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="game-ui">
        <div id="time-display" class="hud-panel">Day 1 - 08:00 AM</div>
        <div id="money-display" class="hud-panel">$1,250.00</div>
        <div id="crosshair"></div>
        <div id="instructions" class="hud-panel">
            Click to Lock Mouse | W A S D to Move | SHIFT to Sprint | E to Interact
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
        
        // ==========================================
        // 1. GAME STATE & VARIABLES
        // ==========================================
        let camera, scene, renderer, controls;
        let prevTime = performance.now();
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        
        // Input state
        const keys = { KeyW: false, KeyA: false, KeyS: false, KeyD: false, ShiftLeft: false };
        
        // Game Data
        let money = 1250;
        let isSprint = false;

        init();
        animate();

        // ==========================================
        // 2. INITIALIZATION
        // ==========================================
        function init() {
            // Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 20, 100); // Realistic depth

            // Camera Setup
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.y = 1.6; // Average human eye level

            // Lighting (Realistic Shadows)
            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
            hemiLight.position.set(0, 200, 0);
            scene.add(hemiLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
            dirLight.position.set(20, 50, -20);
            dirLight.castShadow = true;
            dirLight.shadow.camera.top = 50;
            dirLight.shadow.camera.bottom = -50;
            dirLight.shadow.camera.left = -50;
            dirLight.shadow.camera.right = 50;
            dirLight.shadow.mapSize.width = 2048; // High res shadows
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);

            // Renderer Setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap; // Smooth shadows
            document.body.appendChild(renderer.domElement);

            // Controls (First Person / Third Person foundation)
            controls = new PointerLockControls(camera, document.body);
            document.addEventListener('click', () => { controls.lock(); });
            scene.add(controls.getObject());

            // Key Listeners
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            window.addEventListener('resize', onWindowResize);

            buildSupermarketEnvironment();
        }

        // ==========================================
        // 3. ENVIRONMENT & PLACEHOLDERS
        // ==========================================
        function buildSupermarketEnvironment() {
            // Floor
            const floorGeometry = new THREE.PlaneGeometry(100, 100);
            const floorMaterial = new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.1, metalness: 0.1 }); // Shiny supermarket floor
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Placeholder Shelves
            const shelfGeometry = new THREE.BoxGeometry(2, 2.5, 8);
            const shelfMaterial = new THREE.MeshStandardMaterial({ color: 0x888888 });
            
            // Create a few aisles
            for(let i = -10; i <= 10; i += 5) {
                if(i === 0) continue; // Leave middle open
                const shelf = new THREE.Mesh(shelfGeometry, shelfMaterial);
                shelf.position.set(i, 1.25, -10);
                shelf.castShadow = true;
                shelf.receiveShadow = true;
                scene.add(shelf);
            }

            // Cashier Counter
            const counterGeo = new THREE.BoxGeometry(4, 1.2, 2);
            const counterMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const counter = new THREE.Mesh(counterGeo, counterMat);
            counter.position.set(0, 0.6, 5);
            counter.castShadow = true;
            counter.receiveShadow = true;
            scene.add(counter);
            
            // TODO: Here is where you will load your FBX models!
            // import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
            // const loader = new FBXLoader();
            // loader.load('customers/customer1_idle.fbx', (object) => { scene.add(object); });
        }

        // ==========================================
        // 4. INPUT HANDLING
        // ==========================================
        function onKeyDown(event) {
            if (keys.hasOwnProperty(event.code)) keys[event.code] = true;
        }

        function onKeyUp(event) {
            if (keys.hasOwnProperty(event.code)) keys[event.code] = false;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ==========================================
        // 5. MAIN GAME LOOP
        // ==========================================
        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();

            if (controls.isLocked === true) {
                const delta = (time - prevTime) / 1000;

                // Physics/Movement smoothing
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                direction.z = Number(keys.KeyW) - Number(keys.KeyS);
                direction.x = Number(keys.KeyD) - Number(keys.KeyA);
                direction.normalize(); // Ensure consistent diagonal movement speed

                // Sprint logic
                const speed = keys.ShiftLeft ? 150.0 : 50.0;

                if (keys.KeyW || keys.KeyS) velocity.z -= direction.z * speed * delta;
                if (keys.KeyA || keys.KeyD) velocity.x -= direction.x * speed * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);
                
                // Simple boundary check (keep player on floor)
                if (controls.getObject().position.y < 1.6) {
                    controls.getObject().position.y = 1.6;
                }
            }

            prevTime = time;
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
